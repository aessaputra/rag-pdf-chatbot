# ==============================================================================
# Full-Stack Docker Compose Setup for RAG PDF Chatbot
# Follows .agents/skills/docker-patterns/SKILL.md best practices:
# - Multi-container orchestration (Backend FastAPI + Frontend Next.js 15)
# - Build ARGs passed for Next.js browser bundle embedding
# - Service discovery & dependency order via service_healthy condition
# - Custom bridge network isolation (rag-network)
# - Clean env_file binding for Backend (.env) and Frontend (.env)
# ==============================================================================

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: rag_pdf_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    restart: unless-stopped
    networks:
      - rag-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        # These are injected at build time for Next.js static bundle embedding.
        # Values are read from the frontend/.env file — never hardcode secrets here.
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: rag_pdf_frontend
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - rag-network

networks:
  rag-network:
    driver: bridge
