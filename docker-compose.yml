# ==============================================================================
# Docker Compose Setup for RAG PDF Chatbot
# Follows .agents/skills/docker-patterns/SKILL.md best practices:
# - Service isolation via custom bridge network
# - Healthcheck monitoring
# - Environment injection via env_file (zero hardcoded secrets)
# ==============================================================================

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: rag_pdf_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    restart: unless-stopped
    networks:
      - rag-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  rag-network:
    driver: bridge
